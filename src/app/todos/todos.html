<h1>Todo List</h1>

@if (!todoItems().length) {
    <p>Loading...</p>
}
<section class="wrapper">
    <section class="todos-wrapper">
       <form>
           <label>Filter Todos</label>
           <input name="searchTerm" [(ngModel)]="searchTerm" type="text" placeholder="Search todos...">
       </form>

       <section class="list-container">
          <section>
               <label for="">Not Done</label>
               <ul class="todos">
                  @for (todo of todoItems() | filterTodos : searchTerm() | filterCompletedTodos : false; track todo.id) {
                   <app-todo-item (todoToggled)="updateTodoItem($event)" [todo]="todo"/>
                  }
               </ul>
          </section>
          <section>
               <label>Done</label>
               <ul class="finished-todos">
                 @for (todo of todoItems() | filterCompletedTodos : completedTodo(); track todo.id) {
                    <app-todo-item (todoToggled)="updateTodoItem($event)" [todo]="todo"/>
                 }
               </ul>
          </section>
        </section>
    </section>
</section>
